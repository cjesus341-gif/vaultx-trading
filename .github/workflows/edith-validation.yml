name: EDITH historical backtest validation
on:
  push:
    branches: [feature/edith-xrp-perp-historical-board]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --test edith-perp-backtest.test.mjs tradingview-csv.test.mjs
      - run: npm test
        continue-on-error: true
      - run: node --check server.mjs
      - run: node edith-coinbase-perp-probe.mjs
